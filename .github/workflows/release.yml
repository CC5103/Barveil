name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 1.0.0
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        env:
          BARVEIL_DERIVED_DATA: ${{ runner.temp }}/barveil-derived-data
        run: ./scripts/test.sh

      - name: Build package
        env:
          BARVEIL_MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BARVEIL_DERIVED_DATA: ${{ runner.temp }}/barveil-derived-data
        run: ./scripts/package.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Barveil-${{ steps.version.outputs.version }}
          path: |
            dist/Barveil-${{ steps.version.outputs.version }}.zip
            dist/Barveil-${{ steps.version.outputs.version }}.dmg
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Barveil-${{ steps.version.outputs.version }}.zip
            dist/Barveil-${{ steps.version.outputs.version }}.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **Barveil hides the macOS menu bar only while a full-screen video is actually playing — and brings it right back when you pause.**

            Keep the menu bar everywhere you like it. When a video goes full screen,
            Barveil steps it aside so the picture is uninterrupted; pause the video or
            leave full screen and it returns automatically.

            ### Download

            | File | What it is |
            | --- | --- |
            | `Barveil-${{ steps.version.outputs.version }}.dmg` | Drag **Barveil.app** into *Applications* (recommended) |
            | `Barveil-${{ steps.version.outputs.version }}.zip` | The same app, zipped |
            | `SHA256SUMS.txt` | SHA-256 checksums for both files |

            Requires macOS 14.4 or later. The free build is ad-hoc signed and not notarized:
            on first launch, right-click `Barveil.app` and choose **Open**, or clear the
            quarantine flag once with

            ```sh
            xattr -dr com.apple.quarantine /Applications/Barveil.app
            ```

            Accessibility access is optional but recommended — it makes browser
            full-screen detection exact (Privacy → Open System Settings). Barveil collects
            nothing and makes no network requests. See the
            [README](https://github.com/CC5103/Barveil#readme) for details.
